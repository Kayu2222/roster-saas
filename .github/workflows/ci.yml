name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roster
          POSTGRES_PASSWORD: roster
          POSTGRES_DB: roster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check migrations match the models
        if: matrix.db == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://roster:roster@localhost:5432/roster_test
        run: |
          alembic upgrade head
          alembic check

      - name: Run tests
        env:
          # Empty for the sqlite run; the postgres run uses the real migrated schema.
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://roster:roster@localhost:5432/roster_test' || '' }}
        run: pytest -q

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS -X POST http://localhost:8000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"company_name":"CI Co","owner_name":"CI","email":"ci@example.com","password":"Passw0rd!","modules":["roster","resource"]}'

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: docker
    # Only pushes to main, and only once infra/setup.ps1 has created the GitHub variables.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    concurrency: deploy-production
    permissions:
      id-token: write # lets GitHub issue a short-lived OIDC token; no Azure password is stored anywhere
      contents: read
    env:
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/roster-saas:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Roll out new revision
        id: rollout
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE" \
            --output none
          FQDN=$(az containerapp show \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn --output tsv)
          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"

      - name: Smoke test the live API
        run: |
          # The app scales to zero when idle, so the first request may need a moment.
          for i in $(seq 1 30); do
            if curl -fsS "${{ steps.rollout.outputs.url }}/health"; then
              echo; echo "Live at ${{ steps.rollout.outputs.url }}/docs"; exit 0
            fi
            sleep 10
          done
          echo "API did not become healthy" && exit 1
